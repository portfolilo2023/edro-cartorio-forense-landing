<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP — EDRO | Cartório Forense™</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0c1220;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #5eead4;
      margin-bottom: 10px;
    }
    p.desc {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 40px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #111827;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    label {
      display: block;
      margin: 12px 0 4px;
      color: #a5f3fc;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 14px;
    }
    button {
      margin-top: 22px;
      width: 100%;
      background: linear-gradient(135deg, #5eead4, #22c55e);
      padding: 14px;
      border-radius: 10px;
      border: none;
      color: #020617;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover {
      box-shadow: 0 15px 30px rgba(34,197,94,0.25);
    }
    .result {
      margin-top: 30px;
      background: #0f172a;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      color: #e5e7eb;
    }
    .back {
      margin-top: 20px;
      display: block;
      text-align: center;
      color: #5eead4;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <h1>Simulador PRICE / SAC</h1>
  <p class="desc">MVP do EDRO | Cartório Forense™ — versão funcional</p>

  <div class="container">
    <label>Valor Financiado (R$):</label>
    <input id="pv" type="number" placeholder="Ex.: 150000">

    <label>Taxa de Juros Mensal (%):</label>
    <input id="i" type="number" placeholder="Ex.: 0.8">

    <label>Número de Parcelas:</label>
    <input id="n" type="number" placeholder="Ex.: 360">

    <button onclick="calcular()">Calcular Parcelas</button>

    <div class="result" id="resultado" style="display:none"></div>

    <a class="back" href="../index.html">← Voltar para a Landing Page</a>
  </div>

  <script>
    function calcular() {
      const pv = Number(document.getElementById('pv').value);
      const i = Number(document.getElementById('i').value) / 100;
      const n = Number(document.getElementById('n').value);

      if (!pv || !i || !n) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      // Fórmula PRICE
      const parcelaPRICE = pv * (i * Math.pow(1+i, n)) / (Math.pow(1+i, n) - 1);

      // Fórmula SAC
      const amort = pv / n;
      const parcelaInicialSAC = amort + pv * i;
      const parcelaFinalSAC = amort + amort * i;

      document.getElementById('resultado').style.display = "block";
      document.getElementById('resultado').innerHTML = `
        <h3>Resultados:</h3>
        <p><strong>PRICE:</strong> Parcela fixa de <span style="color:#5eead4">R$ ${parcelaPRICE.toFixed(2)}</span></p>
        <p><strong>SAC:</strong></p>
        <p>Parcela inicial: <span style="color:#5eead4">R$ ${parcelaInicialSAC.toFixed(2)}</span></p>
        <p>Parcela final: <span style="color:#5eead4">R$ ${parcelaFinalSAC.toFixed(2)}</span></p>
      `;
    }
  </script>
</body>
</html>
